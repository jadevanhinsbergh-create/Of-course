<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Of Course. Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF5F0;--plum:#2A1220;--muted:#7A6670;--line:#F0DDD6;--ok:#2F6B53;--bg1:#C0589A;--bg2:#EC7B43;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#7E2F66;--bg2:#B5532A}}
:root[data-theme="dark"]{--bg1:#7E2F66;--bg2:#B5532A}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#C0589A;background:linear-gradient(120deg,var(--bg1),var(--bg2));color:#fff;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
header{width:min(370px,100%);display:flex;align-items:center;justify-content:space-between;gap:8px}
header b.pill{background:var(--cream);padding:4px 14px 6px;border-radius:99px}
.logo{background:linear-gradient(100deg,#C0589A,#EC7B43);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
header b{font-size:22px;letter-spacing:-.03em;font-weight:800}
.seg{display:flex;background:rgba(42,18,32,.35);border-radius:99px;padding:3px}
.seg button{border:0;background:none;color:#fff;font:600 12px Inter,sans-serif;padding:6px 12px;border-radius:99px;cursor:pointer}
.seg button.on{background:var(--cream);color:var(--plum)}
.phone{position:relative;width:min(370px,100%);flex:1;min-height:0;max-height:720px;background:var(--cream);color:var(--plum);border-radius:34px;border:8px solid #141014;display:flex;flex-direction:column;overflow:hidden}
.scr{flex:1;overflow-y:auto}
.tabs{display:flex;border-top:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:9px 0 11px;font:600 11px Inter,sans-serif;color:var(--muted);cursor:pointer}
.tabs button::before{content:"";display:block;width:8px;height:8px;margin:0 auto 4px;border-radius:50%;border:1.5px solid var(--muted)}
.tabs button.on{color:var(--plum)}
.tabs button.on::before{background:var(--plum);border-color:var(--plum)}
button:focus-visible,input:focus-visible{outline:2px solid #C0589A;outline-offset:2px}
.p{padding:16px}
h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em}
h3{margin:18px 0 8px;font-size:13px;font-weight:700}
.sub{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.gap{justify-content:space-between}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--plum);flex:none;cursor:pointer;border:0}
.story{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.story div{text-align:center;font-size:11px;font-weight:600}
.hero{border-radius:18px;padding:16px;color:#fff;min-height:140px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;border:0;width:100%;text-align:left;font-family:inherit;margin-top:14px;background:linear-gradient(135deg,#C0589A,#EC7B43)}
.hero b{font-size:18px;line-height:1.2;letter-spacing:-.02em}
.hero span{font-size:12px;opacity:.9;margin-top:4px}
.tag{align-self:flex-start;background:#fff;color:var(--plum);font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;margin-bottom:auto}
.item{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;text-align:left;font-family:inherit;color:inherit;cursor:pointer}
.item .th{width:44px;height:44px;border-radius:12px;flex:none}
.item b{font-size:13px;display:block}
.btn{width:100%;border:0;border-radius:99px;background:var(--plum);color:#fff;font:700 14px Inter,sans-serif;padding:14px;cursor:pointer;margin-top:12px}
.btn.o{background:none;color:var(--plum);border:1.5px solid var(--plum);padding:9px 18px;width:auto;margin:0;font-size:13px}
.btn.s{width:auto;margin:0;padding:8px 14px;font-size:12px}
.btn.f{background:var(--plum);color:#fff;padding:9px 18px;width:auto;margin:0;font-size:13px}
.banner{height:130px;background:linear-gradient(135deg,#C0589A,#EC7B43)}
.vid{height:170px;background:linear-gradient(135deg,#C0589A,#EC7B43);display:grid;place-items:center}
.vid.d{background:linear-gradient(135deg,#6B2D4A,#9A4A38)}
.play{width:54px;height:54px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-size:20px;color:var(--plum)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid button{background:none;border:0;padding:0;text-align:left;font:600 12px Inter,sans-serif;color:var(--plum);cursor:pointer}
.grid i{display:block;height:84px;border-radius:12px;margin-bottom:6px}
.lesson{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.lesson em{font-style:normal;width:22px;height:22px;border-radius:50%;background:#FBE3DA;display:grid;place-items:center;font-size:11px}
.lesson span{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.free{background:#DDF1E8;color:var(--ok);padding:3px 10px;border-radius:99px}
.ai{background:linear-gradient(135deg,#C0589A,#EC7B43);color:#fff;border-radius:16px;padding:14px;margin-top:12px}
.ai small{font-size:10px;font-weight:700;opacity:.9}
.ai p{margin:6px 0 10px;font-weight:700;font-size:14px;line-height:1.3}
.ai .btn{background:#fff;color:var(--plum);width:auto;margin:0;padding:8px 16px;font-size:12px}
.file{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px;font-weight:600}
.file span{font-size:11px;color:var(--muted);font-weight:500}
.big{font-size:56px;font-weight:800;letter-spacing:-.04em;text-align:center;margin:10px 0 0}
input[type=range]{width:100%;accent-color:#C0589A}
.chips{display:flex;gap:8px;justify-content:center;margin-top:8px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font:700 12px Inter,sans-serif;color:var(--plum);cursor:pointer}
.chips button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.sw{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;font:600 13px Inter,sans-serif;color:var(--plum);cursor:pointer}
.sw i{width:38px;height:22px;border-radius:99px;background:#CDBFC4;position:relative}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.sw.on i{background:var(--ok)}
.sw.on i::after{left:19px}
.bars{display:flex;align-items:flex-end;gap:8px;height:70px;margin:10px 0}
.bars i{flex:1;background:#F6D3C6;border-radius:5px}
.bars i:last-child{background:linear-gradient(#C0589A,#EC7B43)}
.dark{background:var(--plum);color:#fff;border-radius:16px;padding:14px;margin-top:6px;font-size:13px}
.meter{height:8px;border-radius:99px;background:#6a5560;margin:10px 0;overflow:hidden}
.meter i{display:block;height:100%;width:62%;background:#F5C77E;margin-left:62%;width:38%}
.back{display:block;background:none;border:0;padding:0 0 10px;font:700 13px Inter,sans-serif;color:#C0589A;cursor:pointer}
.sticky{position:sticky;top:0;background:var(--cream);z-index:2}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px}
.cats button{flex:none;border:0;border-radius:9px;padding:7px 12px;font:600 12px Inter,sans-serif;background:#F4E4DC;color:var(--plum);cursor:pointer}
.cats button.on{background:var(--plum);color:#fff}
.hrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.hc{flex:none;width:176px}
.vc{margin-top:14px}
.vt{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:14px;position:relative;cursor:pointer;background-size:cover}
.ini{position:absolute;inset:0;display:grid;place-items:center;font:800 54px Inter,sans-serif;letter-spacing:-.04em;color:rgba(255,255,255,.6)}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font:600 11px Inter,sans-serif;padding:2px 7px;border-radius:6px}
.toast{position:absolute;left:16px;right:16px;bottom:74px;background:var(--plum);color:#fff;font-size:13px;font-weight:600;padding:12px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>

if(s==='prof')return `<div class="banner" style="${IMG[S.cid]?`background:linear-gradient(rgba(192,88,154,.45),rgba(236,123,67,.55)),url(${IMG[S.cid].p}) center 25%/cover`:''}"></div><div class="p" style="margin-top:-46px;text-align:center"><span class="av" style="width:84px;height:84px;margin:0 auto;font-size:26px;background:${ab(S.cid)};border:3px solid var(--cream)">${ai(S.cid)}</span><h2 style="margin-top:8px">${c.n}</h2><p class="sub" style="margin:2px 0 12px">${c.r} · ${c.cs.length} course${c.cs.length>1?'s':''}</p><div class="row" style="justify-content:center"><button class="btn f" onclick="follow('${S.cid}')">${S.fol[S.cid]?'Following':'Follow'}</button><button class="btn o" onclick="notify()">${S.not?'Notified':'Notify me'}</button></div><h3 style="text-align:left">Courses</h3><div class="grid">${c.cs.map(i=>`<button onclick="go('course','${i}')"><i style="background:${gr(i)}"></i>${K[i].t}<br><span class="sub">$${K[i].p}</span></button>`).join('')}</div><div class="btn" style="margin-top:16px;font-size:12px;cursor:default">Next drop · Friday</div></div>`;
if(s==='course'){const L=k.l||DL,T=k.tm||DT,o=C[k.by];return `<div class="vid" style="background:${gr(S.kid)}"><div class="play">▶</div></div><div class="p"><h2 style="font-size:19px">${k.t}</h2><div class="row gap" style="margin:8px 0"><button class="row item" style="border:0;padding:0;width:auto" onclick="go('prof','${k.by}')"><span class="av" style="width:24px;height:24px;font-size:9px;background:${ab(k.by)}">${ai(k.by)}</span><b>${o.n}</b></button><span class="sub">${L.length} lessons · ${k.m} min</span></div>${L.map((l,n)=>`<div class="lesson"><em>${n+1}</em>${l}<span class="${n?'':'free'}">${T[n]}</span></div>`).join('')}<button class="btn" onclick="buy()">${S.bought[S.kid]?'Start learning':'Get the course · $'+k.p}</button></div>`}
if(s==='lesson'){const L=k.l||DL,o=C[k.by],n=C[k.by==='alix'?'hailey':k.by==='hailey'?'alix':'alix'],nk=K[n.cs[0]];return `<div class="vid d"><div class="play" style="font-size:16px">❚❚</div></div><div class="p"><span class="sub">Lesson 2 of ${L.length}</span><h2 style="font-size:19px">${L[1]}</h2><div class="card"><b style="font-size:13px">Lesson notes</b><ul class="sub" style="margin:6px 0 0;padding-left:18px;line-height:1.7"><li>What to do first</li><li>Mistakes to avoid</li><li>Try it today</li></ul></div><h3>Because you're learning from ${o.n.split(' ')[0]}</h3><div class="card row"><i style="width:56px;height:56px;border-radius:12px;background:${gr(n.cs[0])};flex:none"></i><div><span class="sub">${n.n} · ${n.r}</span><b style="display:block;font-size:13px;margin:2px 0 6px">${nk.t}</b><button class="btn f s" onclick="follow('${n.cs[0]&&Object.keys(C).find(x=>C[x]===n)}')">${S.fol[Object.keys(C).find(x=>C[x]===n)]?'Following':'Follow '+n.n.split(' ')[0]}</button></div></div><div class="btn" style="background:#FBE3DA;color:var(--plum);cursor:default;font-size:13px">Up next: ${L[2]}</div></div>`}
if(s==='learning'){const b=Object.keys(S.bought);return `<div class="p"><h2>Learning</h2>${b.length?b.map(i=>`<button class="item" onclick="go('lesson','${i}')"><i class="th" style="background:${gr(i)}"></i><div><b>${K[i].t}</b><span class="sub">${C[K[i].by].n} · Continue lesson 2</span></div></button>`).join(''):'<p class="sub" style="margin:10px 0">Nothing here yet. Find a creator on Explore and buy your first course.</p><button class="btn" onclick="go(\'explore\')">Find a creator</button>'}</div>`}
if(s==='me')return `<div class="p"><h2>Me</h2><p class="sub" style="margin:4px 0 12px">Teach what you know and get paid.</p><button class="btn" onclick="setMode('creator')">Open creator studio</button></div>`;
const head=(t)=>`<div class="p"><button class="back" onclick="setMode('learner')">← Back to Of Course</button><span class="sub">Creator studio</span><h2>${t}</h2>`;
if(s==='create')return head('New course')+`<div class="file">Intro.mov<span>Uploaded</span></div><div class="file">Skin prep.mov<span>Uploaded</span></div><div class="file">Final look.mov<span>Uploaded</span></div>${S.outline?`<div class="ai"><small>AI OUTLINE READY</small><p>We turned your 3 videos into 6 lessons with titles, captions and a course description.</p><button class="btn" onclick="toast('Outline opened for review')">Review outline</button></div>`:`<div class="ai"><small>AI OUTLINE</small><p>Turn your videos into a finished course.</p><button class="btn" onclick="genOutline()">Build my outline</button></div>`}<button class="btn" onclick="go('price')">Next: set your price</button></div>`;
if(s==='price'){const p=S.price;return head('Set your price')+`<div class="big" id="pv">$${p}</div><input type="range" min="10" max="90" value="${p}" aria-label="Course price" oninput="setP(this.value)"><div class="chips">${[25,40,90].map(v=>`<button class="${p===v?'on':''}" onclick="pick(${v})">$${v}</button>`).join('')}</div><div class="card"><span class="sub">Per sale</span><div class="row gap" style="margin:6px 0"><b>You keep 85%</b><b id="pk">$${(p*.85).toFixed(2)}</b></div><div class="row gap sub"><span>Of Course 15%</span><span id="pf">$${(p*.15).toFixed(2)}</span></div><p style="margin:8px 0 0;font-size:12px;font-weight:700;color:#B0245C">No monthly software fee.</p></div><button class="btn" onclick="go('publish')">Next: publish</button></div>`}
if(s==='publish')return head('Launch it like a drop')+`<div class="hero" style="cursor:default;min-height:120px"><span class="tag">FRIDAY · 6 PM</span><b>Bridal Glam, Start to Finish</b><span>Countdown live on your profile</span></div>${[['n','Notify my followers'],['c','Countdown on my profile'],['s','Share kit for TikTok and IG']].map(([k,l])=>`<button class="sw ${S.t[k]?'on':''}" onclick="tog('${k}')">${l}<i></i></button>`).join('')}<button class="btn" onclick="sched()">Schedule drop</button></div>`;
return head('Earnings')+`<span class="sub">This month</span><div class="big" style="text-align:left;font-size:44px;margin:0">$8,420</div><div class="bars">${[30,40,34,52,46,68,90].map(h=>`<i style="height:${h}%"></i>`).join('')}</div><div class="dark"><span style="font-size:10px;font-weight:700;opacity:.7">WHERE YOUR SALES CAME FROM</span><div class="row gap" style="margin-top:8px"><span>Your own audience</span><b>62%</b></div><div class="row gap" style="color:#F5C77E;margin-top:4px"><span>Found you on Of Course</span><b>38%</b></div><div class="meter"><i></i></div><b>Customers you never brought yourself.</b></div><div class="card row gap" style="font-size:13px"><b>Next payout</b><span>Friday</span></div></div>`;
}
function R(){
$('seg').innerHTML=['learner','creator'].map(m=>`<button class="${S.mode===m?'on':''}" onclick="setMode('${m}')">${m==='learner'?'Learner':'Creator'}</button>`).join('');
const on=TAB_OF[S.scr]||S.scr;
$('scr').innerHTML=screen();
$('nav').innerHTML=TABS[S.mode].map(([i,l])=>`<button class="${on===i?'on':''}" onclick="go('${i}')">${l}</button>`).join('');
$('scr').scrollTop=0;
}
R();
</script>
</body>
